# Развёртывание на сервере области: PostgreSQL + приложение + NCANode (проверка ЭЦП)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bilim
      POSTGRES_USER: bilim
      POSTGRES_PASSWORD: bilim
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bilim"], interval: 5s, retries: 10 }

  ncanode:
    image: malikzh/ncanode:latest
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    volumes: [uploads:/app/apps/api/data/uploads]

volumes:
  pgdata:
  uploads:
